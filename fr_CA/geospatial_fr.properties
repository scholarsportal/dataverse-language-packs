datasetfieldtype.geographicCoverage.description=Renseignements sur la couverture géographique des données, notamment la portée géographique totale des données.
datasetfieldtype.country.description=Le pays ou la nation visés par le jeu de données.
datasetfieldtype.state.description=L'état ou la province dont le jeu de données traite. Utiliser GeoNames pour connaître l'orthographe exacte et éviter les abréviations.
datasetfieldtype.city.description=Le nom de la ville dont le jeu de données traite. Utiliser GeoNames pour connaître l'orthographe exacte et éviter les abréviations.  
datasetfieldtype.otherGeographicCoverage.description=Autres renseignements sur la couverture géographique des données.
datasetfieldtype.geographicUnit.description=Niveau de regroupement géographique le plus bas couvert par le jeu de données, p. ex. village, pays, région.
datasetfieldtype.geographicBoundingBox.description=La zone de délimitation géographique est la description géographique fondamentale de tout jeu de données qui modélise la géographie. Elle décrit la zone minimale, définie par des longitudes ouest et est et des latitudes nord et sud, qui comprend la plus importante étendue géographique de la couverture géographique du jeu de données. Cet élément est utilisé dans le premier survol d'une recherche fondée sur les coordonnées. L'inclusion de cet élément dans le manuel de codes est recommandée et est obligatoire si la zone polygone délimitée est incluse.
datasetfieldtype.westLongitude.description=Les coordonnées les plus à l'ouest délimitant l'étendue géographique du jeu de données. Une fourchette de valeurs valide, exprimée en degrés décimaux, correspond à -180.0 <=  Valeur de longitude ouest de délimitation <= 180.0.
datasetfieldtype.eastLongitude.description=Les coordonnées les plus à l'est délimitant l'étendue géographique du jeu de données. Une fourchette de valeurs valide, exprimée en degrés décimaux, correspond à -180.0 <=  Valeur de longitude est de délimitation <= 180.0.
datasetfieldtype.northLatitude.description=Les coordonnées les plus au nord délimitant l'étendue géographique du jeu de données. Une fourchette de valeurs valide, exprimée en degrés décimaux, correspond à -90.0 <=  Valeur de latitude nord de délimitation <= 90.0.
datasetfieldtype.southLatitude.description=Les coordonnées les plus au sud délimitant l'étendue géographique du jeu de données. Une fourchette de valeurs valide, exprimée en degrés décimaux, correspond à -90.0 <=  Valeur de latitude sud de délimitation <= 90.0.
