datasetfieldtype.geographicSpatialResolution.description=La résolution spatiale permet de se faire une idée générale de la densité des données spatiales dans la ressource, ou décrit la plage de résolution dans laquelle une ressource numérique peut être utilisée. À noter\u00A0: ce champ doit être répété pour décrire les limites supérieures et inférieures de la plage.
